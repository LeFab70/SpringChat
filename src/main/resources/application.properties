spring.application.name=chat

# Server (port 8080 by default, no override needed)

# H2 file-based database: data survives restarts, stored in ./data/chatdb.mv.db
spring.datasource.url=jdbc:h2:file:./data/chatdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Le schéma est géré par les migrations Flyway (src/main/resources/db/migration), pas par Hibernate
spring.flyway.enabled=true

# H2 web console for inspecting persisted data during development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
