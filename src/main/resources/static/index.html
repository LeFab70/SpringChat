<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>Spring WebSocket Chat</title>

    <link rel="stylesheet" href="/css/styles.css">

</head>

<body>

<div class="background"></div>

<!-- ===================== -->
<!-- Join Modal -->
<!-- ===================== -->

<div class="modal" id="joinModal">

    <div class="modal-card">

        <h1>
            💬 WebSocket Chat
        </h1>

        <p class="subtitle">
            Join the public chat room
        </p>

        <form id="usernameForm" novalidate>

            <input
                    id="username"
                    type="text"
                    placeholder="Choose your username *"
                    autocomplete="off"
                    maxlength="50"
                    required>

            <button type="submit" disabled>

                Join Chat

            </button>

        </form>

        <div class="field-hint">
            <span id="usernameError" class="field-error"></span>
            <span id="usernameCounter" class="char-counter">0/50</span>
        </div>

        <div class="status">

            <div
                    class="spinner hidden"
                    id="spinner">
            </div>

            <span id="connection-status">

            </span>

        </div>

    </div>

</div>

<!-- ===================== -->
<!-- CHAT -->
<!-- ===================== -->

<div class="chat hidden" id="chat-page">

    <!-- HEADER -->

    <header>

        <div class="header-left">

            <div class="avatar" id="myAvatar">
                A
            </div>

            <div>

                <h2>
                    Public Chat
                </h2>

                <small id="currentUsername">

                </small>

            </div>

        </div>

        <div class="header-right">

            <button
                    id="themeBtn"
                    class="icon-btn">

                🌙

            </button>

            <button
                    id="disconnectBtn"
                    class="disconnect">

                Disconnect

            </button>

        </div>

    </header>

    <!-- MESSAGES -->

    <div id="messages">

    </div>

    <div class="toast hidden" id="errorToast"></div>

    <!-- INPUT -->

    <form id="messageForm" novalidate>

        <input

                id="message"

                type="text"

                placeholder="Write a message..."

                autocomplete="off"

                maxlength="1000"

                required>

        <button disabled>

            Send

        </button>

    </form>

    <div class="field-hint">
        <span id="messageCounter" class="char-counter">0/1000</span>
    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

<script src="/js/main.js"></script>

</body>
</html>
